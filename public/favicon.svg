<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EC"/>
      <stop offset="50%" stop-color="#FAF4EA"/>
      <stop offset="100%" stop-color="#F5E8D7"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B89A68"/>
      <stop offset="50%" stop-color="#EAD8BA"/>
      <stop offset="100%" stop-color="#8D7047"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A381E"/>
      <stop offset="100%" stop-color="#6D522B"/>
    </linearGradient>
  </defs>

  <!-- Luxury Cream Rounded Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Foil Border -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#goldBorder)" stroke-width="20"/>

  <!-- Inner Dashed Gold Accent Line -->
  <rect x="44" y="44" width="424" height="424" rx="80" fill="none" stroke="#B89A68" stroke-width="6" stroke-dasharray="16,12" opacity="0.65"/>

  <!-- Monogram Initials "M&N" -->
  <text x="256" y="325" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="210" font-weight="700" fill="url(#goldText)" text-anchor="middle" letter-spacing="-6">M&amp;N</text>
</svg>
